<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C10">
<title>SIGAI — Sifir Garis Itamta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#E9EFFF; --blob1:#BFD4FF; --blob2:#FFD9E8;
  --card:#FFFFFF; --card2:#F2F5FD;
  --ink:#101426; --ink2:#6C748C; --hair:rgba(16,20,38,.09);
  --line:#141A2E; --dot:#3B6BFF; --hot:#F0453A; --go:#12A150;
  --key:#FFFFFF; --keyink:#101426;
  --shadow:0 1px 2px rgba(20,30,70,.06), 0 10px 26px rgba(20,30,70,.09);
  --keyshadow:0 1px 1px rgba(20,30,70,.05), 0 3px 8px rgba(20,30,70,.10);
  --r:24px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#080B14; --blob1:#1B2C57; --blob2:#3A1E38;
  --card:#141A2A; --card2:#1C2436;
  --ink:#EEF1F8; --ink2:#8F98AF; --hair:rgba(238,241,248,.12);
  --line:#EEF1F8; --dot:#7CA0FF; --hot:#FF6A5E; --go:#3DD68C;
  --key:#222B41; --keyink:#EEF1F8;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.45);
  --keyshadow:0 1px 2px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  min-height:100vh; color:var(--ink); position:relative; overflow-x:hidden;
  font-family:"Nunito",-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  font-weight:700; -webkit-font-smoothing:antialiased;
  padding:max(16px,env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));
  transition:background .35s ease,color .35s ease;
}
body::before,body::after{
  content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(60px);pointer-events:none;
  transition:background .35s ease;
}
body::before{width:70vw;height:70vw;max-width:420px;max-height:420px;top:-14vw;right:-22vw;background:var(--blob1);opacity:.75}
body::after{width:62vw;height:62vw;max-width:380px;max-height:380px;bottom:-16vw;left:-20vw;background:var(--blob2);opacity:.6}
.wrap{max-width:520px;margin:0 auto;position:relative}

header{display:flex;align-items:center;gap:13px;margin:4px 4px 18px}
.mark{width:50px;height:50px;border-radius:16px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,#4E7BFF,#2E4CE0);box-shadow:0 6px 16px rgba(46,76,224,.38)}
h1{font-size:26px;font-weight:900;letter-spacing:-.7px;margin:0;line-height:1}
.sub{font-size:12.5px;color:var(--ink2);font-weight:700;margin-top:4px}
.theme{margin-left:auto;width:46px;height:46px;border-radius:16px;border:0;background:var(--card);
  box-shadow:var(--shadow);color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center;
  transition:transform .12s}
.theme:active{transform:scale(.9)}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card2);padding:6px;border-radius:19px;margin-bottom:18px}
.seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:17px;font-weight:800;
  padding:13px 8px;border-radius:14px;cursor:pointer;transition:.2s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(20,30,70,.14)}
html[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--key)}

.slots{display:flex;align-items:center;gap:10px}
.slot{flex:1;background:var(--card2);border:2.5px solid transparent;border-radius:20px;padding:12px 10px 14px;
  text-align:center;cursor:pointer;transition:.2s;min-width:0}
.slot[aria-selected="true"]{border-color:var(--dot);background:var(--card);box-shadow:0 0 0 4px rgba(59,107,255,.14)}
.slot .lbl{font-size:10.5px;color:var(--ink2);font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.slot .val{font-size:34px;font-weight:900;letter-spacing:-1.4px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.slot .val.ghost{color:var(--ink2);opacity:.32}
.op{font-size:26px;font-weight:900;color:var(--ink2);flex:none;width:22px;text-align:center}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pad button{border:0;background:var(--key);color:var(--keyink);border-radius:19px;padding:17px 0;
  font:inherit;font-size:26px;font-weight:800;box-shadow:var(--keyshadow);cursor:pointer;transition:transform .08s,filter .12s}
.pad button:active{transform:scale(.92);filter:brightness(.96)}
.pad .util{font-size:18px;color:var(--ink2)}
.pad .go{grid-column:1/-1;background:linear-gradient(150deg,#4E7BFF,#2E4CE0);color:#fff;font-size:19px;
  font-weight:900;padding:19px 0;box-shadow:0 6px 18px rgba(46,76,224,.42)}

.hint{font-size:13px;color:var(--ink2);text-align:center;margin:14px 2px 0;font-weight:700;line-height:1.5}
.egs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.eg{border:0;background:var(--card2);color:var(--ink2);font:inherit;font-size:13px;font-weight:800;
  padding:9px 14px;border-radius:999px;cursor:pointer;transition:transform .08s}
.eg:active{transform:scale(.93)}

.answer{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.answer .q{font-size:15px;color:var(--ink2);font-weight:800}
.answer .a{font-size:33px;font-weight:900;color:var(--go);letter-spacing:-1px;line-height:1}

.paper{background:var(--card2);border-radius:18px;padding:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
svg.board{display:block;width:100%;height:auto;min-width:260px}

.tbl{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
.tbl caption{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:var(--ink2);padding-bottom:9px}
.tbl th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--ink2);padding:0 0 7px}
.tbl td{padding:8px 0;border-top:1px solid var(--hair);font-weight:800}
.tbl td:last-child,.tbl th:last-child{text-align:right}
.tbl tr.sum td{border-top:2px solid var(--hair);font-weight:900;font-size:16px}
.sw{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:8px;vertical-align:-1px}

.note{font-size:13.5px;color:var(--ink2);line-height:1.6;font-weight:700;margin:0}
footer{text-align:center;font-size:12px;color:var(--ink2);font-weight:700;line-height:1.65;margin-top:24px;opacity:.9}

.gline{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.gline.zero{stroke-dasharray:7 7}
.cell{opacity:.42}
.hlabel{fill:var(--ink2);font-size:11px;font-weight:800;letter-spacing:.4px;
  paint-order:stroke;stroke:var(--card2);stroke-width:3.5;stroke-linejoin:round}
.dlabel{fill:var(--ink);font-size:20px;font-weight:900}
.arrow{stroke:var(--dot);stroke-width:2.5;stroke-linecap:round;fill:none}
.blabel{fill:var(--dot);font-size:13px;font-weight:900}
.rlabel{fill:var(--hot);font-size:12px;font-weight:800;
  paint-order:stroke;stroke:var(--card2);stroke-width:3.5;stroke-linejoin:round}
.dot{fill:var(--dot)}
.dot.rest{fill:var(--hot)}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.anim-line{animation:draw .42s ease forwards;animation-delay:var(--d)}
.anim-dot{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .3s cubic-bezier(.34,1.6,.5,1) forwards;animation-delay:var(--d)}
.anim-fade{opacity:0;animation:fade .3s ease forwards;animation-delay:var(--d)}
@media (prefers-reduced-motion:reduce){
  .anim-line,.anim-dot,.anim-fade{animation:none!important;stroke-dashoffset:0!important;transform:none!important;opacity:1!important}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="mark" aria-hidden="true">
    <svg width="27" height="27" viewBox="0 0 24 24">
      <g stroke="#fff" stroke-width="2.1" stroke-linecap="round" opacity=".95">
        <path d="M8.5 3.2v17.6M14.5 3.2v17.6M3.2 8.5h17.6M3.2 14.5h17.6"/>
      </g>
      <g fill="#FFD84D"><circle cx="8.5" cy="8.5" r="2.3"/><circle cx="14.5" cy="14.5" r="2.3"/></g>
    </svg>
  </div>
  <div>
    <h1>SIGAI</h1>
    <div class="sub">Sifir Garis Itamta · darab &amp; bahagi</div>
  </div>
  <button class="theme" id="theme" aria-label="Tukar mod gelap">🌙</button>
</header>

<div class="card">
  <div class="seg" role="group" aria-label="Pilih operasi">
    <button id="mDarab" aria-pressed="true">Darab ×</button>
    <button id="mBahagi" aria-pressed="false">Bahagi ÷</button>
  </div>

  <div class="slots">
    <div class="slot" id="s0" role="button" tabindex="0" aria-selected="true">
      <div class="lbl" id="l0">Nombor pertama</div>
      <div class="val ghost" id="v0">0</div>
    </div>
    <div class="op" id="opSign">×</div>
    <div class="slot" id="s1" role="button" tabindex="0" aria-selected="false">
      <div class="lbl" id="l1">Nombor kedua</div>
      <div class="val ghost" id="v1">0</div>
    </div>
  </div>

  <div class="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="util" data-k="clear">Padam</button>
    <button data-k="0">0</button>
    <button class="util" data-k="back">⌫</button>
    <button class="go" data-k="go">Lukis Sigai</button>
  </div>

  <p class="hint" id="hint">Tekan nombor, kemudian tekan <b>Lukis Sigai</b>.</p>
  <div class="egs" id="egs"></div>
</div>

<div id="out"></div>

<footer>
  Kaedah Sigai dicipta oleh <b>Hj. Itamta bin Harun</b><br>
  Johan Inovasi Negara 2012 · belajar darab &amp; bahagi tanpa hafal sifir
</footer>

</div>

<script>
(function(){
"use strict";
const NS="http://www.w3.org/2000/svg";
const HOUSE=["Sa","Pu","Ra","Ri","PuRi","RaRi","Jt","PuJt","RaJt"];
const HOUSE_FULL=["Sa","Puluh","Ratus","Ribu","Puluh Ribu","Ratus Ribu","Juta","Puluh Juta","Ratus Juta"];
const TINT=["#1F4FD8","#12A150","#E58C00","#8B5CF6","#E5484D","#0EA5A5","#D6409F","#6B7280","#4B5563"];

let mode="darab", slot=0, num=["",""], theme="light";

const $=id=>document.getElementById(id);
const el=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};

/* ---------- theme ---------- */
if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches) theme="dark";
function applyTheme(){
  const root=document.documentElement;
  root.setAttribute("data-theme",theme);
  const bg=getComputedStyle(root).getPropertyValue("--bg").trim();
  root.style.background=bg; document.body.style.background=bg;
  const mt=document.querySelector('meta[name="theme-color"]'); if(mt)mt.setAttribute("content",bg);
  $("theme").textContent=theme==="dark"?"☀️":"🌙";
  $("theme").setAttribute("aria-label",theme==="dark"?"Tukar ke mod terang":"Tukar ke mod gelap");
}
$("theme").onclick=()=>{theme=theme==="dark"?"light":"dark";applyTheme();};
applyTheme();

/* ---------- input ---------- */
const EG={darab:[[20,3],[24,301],[1,9],[12,13]],bahagi:[[7,3],[50,2],[86,4],[154,6]]};
function renderEg(){
  const box=$("egs");box.innerHTML="";
  EG[mode].forEach(p=>{
    const b=document.createElement("button");
    b.className="eg";b.textContent=p[0]+(mode==="darab"?" × ":" ÷ ")+p[1];
    b.onclick=()=>{num=[String(p[0]),String(p[1])];slot=1;paint();run();};
    box.appendChild(b);
  });
}
function setMode(m){
  mode=m;
  $("mDarab").setAttribute("aria-pressed",m==="darab");
  $("mBahagi").setAttribute("aria-pressed",m==="bahagi");
  $("opSign").textContent=m==="darab"?"×":"÷";
  $("l0").textContent=m==="darab"?"Nombor pertama":"Nombor dibahagi";
  $("l1").textContent=m==="darab"?"Nombor kedua":"Pembahagi";
  $("hint").innerHTML=m==="darab"
    ? "Tekan nombor, kemudian tekan <b>Lukis Sigai</b>."
    : "Pembahagi guna <b>1 digit</b> (1–9) dahulu.";
  num=["",""];slot=0;$("out").innerHTML="";paint();renderEg();
}
$("mDarab").onclick=()=>setMode("darab");
$("mBahagi").onclick=()=>setMode("bahagi");
$("s0").onclick=()=>{slot=0;paint();};
$("s1").onclick=()=>{slot=1;paint();};

function paint(){
  for(let i=0;i<2;i++){
    const v=$("v"+i);
    v.textContent=num[i]===""?"0":num[i];
    v.classList.toggle("ghost",num[i]==="");
    $("s"+i).setAttribute("aria-selected",slot===i);
  }
}
document.querySelectorAll(".pad button").forEach(b=>{
  b.onclick=()=>{
    const k=b.dataset.k;
    if(k==="go")return run();
    if(k==="clear"){num=["",""];slot=0;$("out").innerHTML="";return paint();}
    if(k==="back"){num[slot]=num[slot].slice(0,-1);return paint();}
    const max=(mode==="bahagi"&&slot===1)?1:4;
    if(num[slot].length>=max){if(slot===0){slot=1;paint();}else return;}
    if(num[slot]==="0")num[slot]="";
    if(num[slot].length<max)num[slot]+=k;
    paint();
  };
});

/* ---------- messages ---------- */
function msg(html){$("out").innerHTML='<div class="card"><p class="note">'+html+'</p></div>';}

function run(){
  const a=parseInt(num[0]||"0",10), b=parseInt(num[1]||"0",10);
  if(!num[0]||!num[1])return msg("Isi kedua-dua nombor dulu, baru boleh lukis.");
  if(mode==="darab"){
    if(a===0||b===0)return msg("Sigai darab guna nombor 1 ke atas. Sebarang nombor darab 0 memang jawapannya 0.");
    darab(num[0],num[1]);
  }else{
    if(b===0)return msg("Tak boleh bahagi dengan 0 — garisan menegak mesti ada sekurang-kurangnya satu.");
    if(a<b)return msg(a+" lebih kecil daripada "+b+", jadi jawapannya 0 baki "+a+". Cuba nombor dibahagi yang lebih besar.");
    bahagi(num[0],b);
  }
  $("out").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ================= SIGAI DARAB ================= */
function darab(as,bs){
  const A=[...as].map(Number), B=[...bs].map(Number);
  const m=A.length,n=B.length;
  const S=24, GAP=46, PX=52, PY=52;

  let x=PX; const gv=A.map(d=>{const c=d===0?1:d;const ls=[];for(let k=0;k<c;k++)ls.push(x+k*S);x+=(c-1)*S+GAP;return{d,ls};});
  let y=PY; const gh=B.map(d=>{const c=d===0?1:d;const ls=[];for(let k=0;k<c;k++)ls.push(y+k*S);y+=(c-1)*S+GAP;return{d,ls};});
  const maxX=gv[m-1].ls[gv[m-1].ls.length-1], maxY=gh[n-1].ls[gh[n-1].ls.length-1];
  const W=maxX+PX, H=maxY+PY;
  const top=PY-26, bot=maxY+26, left=PX-26, right=maxX+26;

  const svg=el("svg",{class:"board",viewBox:"0 0 "+W+" "+H,role:"img"});
  svg.setAttribute("aria-label","Rajah sigai darab "+as+" darab "+bs);
  let t=0;

  // house tints per cell
  const rows=[];
  for(let i=0;i<m;i++)for(let j=0;j<n;j++){
    const gi=gv[i],gj=gh[j];
    const p=(m-1-i)+(n-1-j);
    const x0=gi.ls[0]-S/2, x1=gi.ls[gi.ls.length-1]+S/2;
    const y0=gj.ls[0]-S/2, y1=gj.ls[gj.ls.length-1]+S/2;
    const zero=(gi.d===0||gj.d===0);
    const r=el("rect",{x:x0,y:y0,width:x1-x0,height:y1-y0,rx:8,fill:TINT[p%TINT.length],
      class:"cell anim-fade","fill-opacity":zero?.05:.13,style:"--d:"+(t*22)+"ms"});
    svg.appendChild(r);
    const lab=el("text",{x:x0+6,y:y0+14,class:"hlabel anim-fade",style:"--d:"+(t*22+200)+"ms"});
    lab.textContent=HOUSE[p];svg.appendChild(lab);
    rows.push({p,i,j,zero,titik:gi.d*gj.d,nilai:gi.d*gj.d*Math.pow(10,p)});
    t++;
  }

  // vertical lines
  let d=0;
  gv.forEach(g=>g.ls.forEach(vx=>{
    const L=bot-top;
    const l=el("line",{x1:vx,y1:top,x2:vx,y2:bot,class:"gline anim-line"+(g.d===0?" zero":""),
      style:"stroke-dasharray:"+(g.d===0?"7 7":L)+";stroke-dashoffset:"+(g.d===0?0:L)+";--d:"+(d*45)+"ms"});
    if(g.d===0)l.classList.remove("anim-line"),l.classList.add("anim-fade"),l.style.setProperty("--d",(d*45)+"ms");
    svg.appendChild(l);d++;
  }));
  gh.forEach(g=>g.ls.forEach(hy=>{
    const L=right-left;
    const l=el("line",{x1:left,y1:hy,x2:right,y2:hy,class:"gline anim-line"+(g.d===0?" zero":""),
      style:"stroke-dasharray:"+(g.d===0?"7 7":L)+";stroke-dashoffset:"+(g.d===0?0:L)+";--d:"+(d*45)+"ms"});
    if(g.d===0)l.classList.remove("anim-line"),l.classList.add("anim-fade"),l.style.setProperty("--d",(d*45)+"ms");
    svg.appendChild(l);d++;
  }));
  const after=d*45+300;

  // digit labels
  gv.forEach(g=>{
    const cx=(g.ls[0]+g.ls[g.ls.length-1])/2;
    const tx=el("text",{x:cx,y:top-10,class:"dlabel anim-fade","text-anchor":"middle",style:"--d:"+after+"ms"});
    tx.textContent=g.d;svg.appendChild(tx);
  });
  gh.forEach(g=>{
    const cy=(g.ls[0]+g.ls[g.ls.length-1])/2;
    const tx=el("text",{x:left-12,y:cy+7,class:"dlabel anim-fade","text-anchor":"end",style:"--d:"+after+"ms"});
    tx.textContent=g.d;svg.appendChild(tx);
  });

  // intersection dots
  let k=0;
  gv.forEach(gi=>gh.forEach(gj=>{
    if(gi.d===0||gj.d===0)return;
    gi.ls.forEach(vx=>gj.ls.forEach(hy=>{
      svg.appendChild(el("circle",{cx:vx,cy:hy,r:5,class:"dot anim-dot",style:"--d:"+(after+120+k*14)+"ms"}));
      k++;
    }));
  }));

  // table
  rows.sort((a,b)=>b.p-a.p||a.i-b.i);
  const total=rows.reduce((s,r)=>s+r.nilai,0);
  let tb="";
  rows.forEach(r=>{
    tb+='<tr><td><span class="sw" style="background:'+TINT[r.p%TINT.length]+'"></span>'+HOUSE_FULL[r.p]+
        '</td><td>'+(r.zero?"0 (putus-putus)":r.titik+" titik")+'</td><td>'+r.nilai.toLocaleString("en-US")+'</td></tr>';
  });
  tb+='<tr class="sum"><td>Jumlah</td><td></td><td>'+total.toLocaleString("en-US")+'</td></tr>';

  show(svg,as+" × "+bs+" =",total.toLocaleString("en-US"),
    '<table class="tbl"><caption>Jadual kiraan sigai darab</caption>'+
    '<tr><th>Rumah angka</th><th>Titik persilangan</th><th>Nilai</th></tr>'+tb+'</table>');
}

/* ================= SIGAI BAHAGI ================= */
function bahagi(ds,div){
  const D=[...ds].map(Number), n=D.length;
  const S=32, ROW=30, PX=122, PY=54, GAPH=22;

  const xs=[];for(let k=0;k<div;k++)xs.push(PX+k*S);
  const lastX=xs[xs.length-1];

  // long division by houses
  let carry=0, y=PY, houses=[], qs="";
  for(let i=0;i<n;i++){
    const p=n-1-i, titik=carry*10+D[i], full=Math.floor(titik/div), rem=titik%div;
    houses.push({p,digit:D[i],titik,full,rem,y0:y});
    y+=full*ROW+(rem>0?ROW:0)+GAPH;
    carry=rem;qs+=full;
  }
  const quotient=parseInt(qs,10), baki=carry;
  const W=lastX+170, H=y+PY-GAPH;
  const top=PY-30, bot=H-24;

  const svg=el("svg",{class:"board",viewBox:"0 0 "+W+" "+H,role:"img"});
  svg.setAttribute("aria-label","Rajah sigai bahagi "+ds+" bahagi "+div);

  // vertical lines = pembahagi
  xs.forEach((vx,k)=>{
    const L=bot-top;
    svg.appendChild(el("line",{x1:vx,y1:top,x2:vx,y2:bot,class:"gline anim-line",
      style:"stroke-dasharray:"+L+";stroke-dashoffset:"+L+";--d:"+(k*70)+"ms"}));
  });
  const after=div*70+250;
  const dl=el("text",{x:(xs[0]+lastX)/2,y:top-12,class:"dlabel anim-fade","text-anchor":"middle",style:"--d:"+after+"ms"});
  dl.textContent=div;svg.appendChild(dl);
  const cap=el("text",{x:(xs[0]+lastX)/2,y:top+4,class:"hlabel anim-fade","text-anchor":"middle",style:"--d:"+after+"ms"});
  cap.textContent=div+" garisan menegak";svg.appendChild(cap);

  let t=0;
  houses.forEach((h,hi)=>{
    let ry=h.y0;
    // tanda sempang bila digit rumah ini 0
    if(h.digit===0){
      xs.forEach(vx=>svg.appendChild(el("line",{x1:vx-11,y1:ry-13,x2:vx+11,y2:ry-13,
        class:"gline anim-fade",style:"--d:"+(after+t*30)+"ms"})));
      const s=el("text",{x:xs[0]-16,y:ry-9,class:"rlabel anim-fade","text-anchor":"end",style:"--d:"+(after+t*30)+"ms"});
      s.textContent="tanda sempang = 0";svg.appendChild(s);
    }
    // label rumah
    const rl=el("text",{x:xs[0]-16,y:h.y0+8,class:"hlabel anim-fade","text-anchor":"end",style:"--d:"+(after+t*30)+"ms"});
    rl.textContent=HOUSE[h.p];svg.appendChild(rl);

    // baris penuh
    for(let r=0;r<h.full;r++){
      xs.forEach(vx=>{svg.appendChild(el("circle",{cx:vx,cy:ry,r:6,class:"dot anim-dot",style:"--d:"+(after+100+t*30)+"ms"}));t++;});
      const a=el("path",{d:"M"+(lastX+16)+" "+ry+" H"+(lastX+58)+" m-9 -5 l9 5 l-9 5",class:"arrow anim-fade",style:"--d:"+(after+180+t*30)+"ms"});
      svg.appendChild(a);
      ry+=ROW;
    }
    if(h.full>0){
      const v=el("text",{x:lastX+66,y:h.y0+(h.full-1)*ROW/2+6,class:"blabel anim-fade",style:"--d:"+(after+240+t*30)+"ms"});
      v.textContent="= "+(h.full*Math.pow(10,h.p)).toLocaleString("en-US");svg.appendChild(v);
    }
    // titik baki
    if(h.rem>0){
      for(let c=0;c<h.rem;c++){
        svg.appendChild(el("circle",{cx:xs[c],cy:ry,r:6,class:"dot rest anim-dot",style:"--d:"+(after+100+t*30)+"ms"}));t++;
      }
      const isLast=hi===houses.length-1;
      const r=el("text",{x:xs[h.rem-1]+18,y:ry+5,class:"rlabel anim-fade",style:"--d:"+(after+240+t*30)+"ms"});
      r.textContent=isLast?("baki "+h.rem):("baki "+h.rem+" → "+(h.rem*10)+" titik di rumah "+HOUSE[h.p-1]);
      svg.appendChild(r);
    }
  });

  let tb="";
  houses.forEach(h=>{
    tb+='<tr><td><span class="sw" style="background:'+TINT[h.p%TINT.length]+'"></span>'+HOUSE_FULL[h.p]+
        '</td><td>'+h.titik+' titik</td><td>'+(h.full?h.full+" selari = "+(h.full*Math.pow(10,h.p)):"—")+'</td></tr>';
  });
  tb+='<tr class="sum"><td>Jawapan</td><td>'+(baki?"baki "+baki:"tiada baki")+'</td><td>'+quotient.toLocaleString("en-US")+'</td></tr>';

  show(svg,ds+" ÷ "+div+" =",quotient.toLocaleString("en-US")+(baki?" baki "+baki:""),
    '<table class="tbl"><caption>Jadual kiraan sigai bahagi</caption>'+
    '<tr><th>Rumah angka</th><th>Titik</th><th>Titik selari</th></tr>'+tb+'</table>');
}

/* ---------- output shell ---------- */
function show(svg,q,a,tableHTML){
  const card=document.createElement("div");card.className="card";
  const head=document.createElement("div");head.className="answer";
  head.innerHTML='<span class="q">'+q+'</span><span class="a">'+a+'</span>';
  const paper=document.createElement("div");paper.className="paper";paper.appendChild(svg);
  card.appendChild(head);card.appendChild(paper);
  const tw=document.createElement("div");tw.innerHTML=tableHTML;card.appendChild(tw);
  const out=$("out");out.innerHTML="";out.appendChild(card);
}

setMode("darab");
})();
</script>
